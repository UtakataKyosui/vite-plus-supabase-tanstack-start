catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.0.0
  vite-plus: 1.0.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
permissions:
  '@tanstack/react-router':
    skills: [router-query, migrate-from-react-router, react-router]
  '@tanstack/react-start':
    skills: [migrate-from-nextjs, react-start]
skills:
  dirs:
    - .agent/skills
    - .agents/skills
    - .claude/skills
    - .cursor/skills
    - .gemini/skills
    - .github/skills
