components:
  securitySchemes:
    SessionCookie:
      type: apiKey
      in: cookie
      name: sb-auth-token
      description: |-
        Supabase Auth session cookie set by @supabase/ssr (`sb-<project-ref>-auth-token`,
        possibly split into `.0`, `.1`, ... chunks). Used by the web client.

        Requests that change state (POST, PUT, PATCH, DELETE) are rejected unless the `Origin`
        header matches the server's own origin.
    ApiKey:
      type: http
      scheme: bearer
      description: |-
        API key issued by `POST /v1/users/self/api-keys`, sent as `Authorization: Bearer <key>`.
        For external clients. API keys cannot manage API keys.
  schemas:
    attachment.Type:
      type: string
      enum:
        - attachment
        - photo
        - manual
        - warranty
        - attachment
        - receipt
        - thumbnail
      x-enum-varnames:
        - DefaultType
        - TypePhoto
        - TypeManual
        - TypeWarranty
        - TypeAttachment
        - TypeReceipt
        - TypeThumbnail
    authroles.Role:
      type: string
      enum:
        - user
        - admin
        - user
        - attachments
      x-enum-varnames:
        - DefaultRole
        - RoleAdmin
        - RoleUser
        - RoleAttachments
    currencies.Currency:
      type: object
      properties:
        code:
          type: string
        decimals:
          type: integer
        local:
          type: string
        name:
          type: string
        symbol:
          type: string
    ent.APIKey:
      type: object
      properties:
        created_at:
          description: CreatedAt holds the value of the "created_at" field.
          type: string
        edges:
          description: |-
            Edges holds the relations/edges for other nodes in the graph.
            The values are being populated by the APIKeyQuery when eager-loading is set.
          allOf:
            - $ref: "#/components/schemas/ent.APIKeyEdges"
        expires_at:
          description: ExpiresAt holds the value of the "expires_at" field.
          type: string
        id:
          description: ID of the ent.
          type: string
        last_used_at:
          description: LastUsedAt holds the value of the "last_used_at" field.
          type: string
        name:
          description: Name holds the value of the "name" field.
          type: string
        updated_at:
          description: UpdatedAt holds the value of the "updated_at" field.
          type: string
        user_id:
          description: UserID holds the value of the "user_id" field.
          type: string
    ent.APIKeyEdges:
      type: object
      properties:
        user:
          description: User holds the value of the user edge.
          allOf:
            - $ref: "#/components/schemas/ent.User"
    ent.Attachment:
      type: object
      properties:
        created_at:
          description: CreatedAt holds the value of the "created_at" field.
          type: string
        edges:
          description: |-
            Edges holds the relations/edges for other nodes in the graph.
            The values are being populated by the AttachmentQuery when eager-loading is set.
          allOf:
            - $ref: "#/components/schemas/ent.AttachmentEdges"
        id:
          description: ID of the ent.
          type: string
        mime_type:
          description: MimeType holds the value of the "mime_type" field.
          type: string
        path:
          description: Path holds the value of the "path" field.
          type: string
        primary:
          description: Primary holds the value of the "primary" field.
          type: boolean
        title:
          description: Title holds the value of the "title" field.
          type: string
        type:
          description: Type holds the value of the "type" field.
          allOf:
            - $ref: "#/components/schemas/attachment.Type"
        updated_at:
          description: UpdatedAt holds the value of the "updated_at" field.
          type: string
    ent.AttachmentEdges:
      type: object
      properties:
        entity:
          description: Entity holds the value of the entity edge.
          allOf:
            - $ref: "#/components/schemas/ent.Entity"
        thumbnail:
          description: Thumbnail holds the value of the thumbnail edge.
          allOf:
            - $ref: "#/components/schemas/ent.Attachment"
    ent.AuthRoles:
      type: object
      properties:
        edges:
          description: |-
            Edges holds the relations/edges for other nodes in the graph.
            The values are being populated by the AuthRolesQuery when eager-loading is set.
          allOf:
            - $ref: "#/components/schemas/ent.AuthRolesEdges"
        id:
          description: ID of the ent.
          type: integer
        role:
          description: Role holds the value of the "role" field.
          allOf:
            - $ref: "#/components/schemas/authroles.Role"
    ent.AuthRolesEdges:
      type: object
      properties:
        token:
          description: Token holds the value of the token edge.
          allOf:
            - $ref: "#/components/schemas/ent.AuthTokens"
    ent.AuthTokens:
      type: object
      properties:
        created_at:
          description: CreatedAt holds the value of the "created_at" field.
          type: string
        edges:
          description: |-
            Edges holds the relations/edges for other nodes in the graph.
            The values are being populated by the AuthTokensQuery when eager-loading is set.
          allOf:
            - $ref: "#/components/schemas/ent.AuthTokensEdges"
        expires_at:
          description: ExpiresAt holds the value of the "expires_at" field.
          type: string
        id:
          description: ID of the ent.
          type: string
        token:
          description: Token holds the value of the "token" field.
          type: array
          items:
            type: integer
        updated_at:
          description: UpdatedAt holds the value of the "updated_at" field.
          type: string
    ent.AuthTokensEdges:
      type: object
      properties:
        roles:
          description: Roles holds the value of the roles edge.
          allOf:
            - $ref: "#/components/schemas/ent.AuthRoles"
        user:
          description: User holds the value of the user edge.
          allOf:
            - $ref: "#/components/schemas/ent.User"
    ent.Entity:
      type: object
      properties:
        archived:
          description: Archived holds the value of the "archived" field.
          type: boolean
        asset_id:
          description: AssetID holds the value of the "asset_id" field.
          type: integer
        created_at:
          description: CreatedAt holds the value of the "created_at" field.
          type: string
        description:
          description: Description holds the value of the "description" field.
          type: string
        edges:
          description: |-
            Edges holds the relations/edges for other nodes in the graph.
            The values are being populated by the EntityQuery when eager-loading is set.
          allOf:
            - $ref: "#/components/schemas/ent.EntityEdges"
