openapi: 3.0.0
info:
  title: Smart Box API
  version: "1.0"
  description: |-
    API contract for the inventory backend in apps/backend.

    Started from sysadminsmedia/homebox backend (commit 4d19c9e4d23ae3e55c12c844e4810b494a0f1318)
    and maintained by hand from there. Authentication is provided by Supabase Auth.
  contact:
    name: Homebox Team
    url: https://discord.homebox.software
  license:
    name: AGPL-3.0
    url: https://github.com/sysadminsmedia/homebox/blob/main/LICENSE
servers:
  - url: /api
    description: Same origin as the web client
security:
  - SessionCookie: []
  - ApiKey: []
paths:
  /v1/actions/create-missing-thumbnails:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      description: Creates thumbnails for items that are missing them
      tags:
        - Actions
      summary: Create Missing Thumbnails
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: createMissingThumbnails
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/actions/ensure-asset-ids:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      description: Ensures all items in the database have an asset ID
      tags:
        - Actions
      summary: Ensure Asset IDs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: ensureAssetID
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/actions/ensure-import-refs:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      description: Ensures all items in the database have an import ref
      tags:
        - Actions
      summary: Ensures Import Refs
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: ensureImportRefs
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/actions/set-primary-photos:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      description: Sets the first photo of each item as the primary photo
      tags:
        - Actions
      summary: Set Primary Photos
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: setPrimaryPhotos
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/actions/wipe-inventory:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      description: Deletes all items in the inventory
      tags:
        - Actions
      summary: Wipe Inventory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.WipeInventoryOptions"
        description: Wipe options
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: wipeInventory
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/actions/zero-item-time-fields:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      description: Resets all item date fields to the beginning of the day
      tags:
        - Actions
      summary: Zero Out Time Fields
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.ActionAmountResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: itemDateZeroOut
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/assets/{id}:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Items
      summary: Get Item by Asset ID
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Asset ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.PaginationResult-repo_EntitySummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: assetGet
  /v1/currencies:
    get:
      tags:
        - Base
      summary: Currency
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/currencies.Currency"
      operationId: currency
      security: []
  /v1/entities:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Query All Entities
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: "search string; matches names, descriptions, serial/model numbers, manufacturers, notes, purchase sources, tag names, and custom field values. Use #<assetId> to look up by asset ID and double quotes for exact phrases"
          name: q
          in: query
          schema:
            type: string
        - description: page number
          name: page
          in: query
          schema:
            type: integer
        - description: items per page
          name: pageSize
          in: query
          schema:
            type: integer
        - description: tags Ids
          name: tags
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
        - description: require all selected tags to match (AND) instead of any (OR)
          name: matchAllTags
          in: query
          schema:
            type: boolean
        - description: parent Ids
          name: parentIds
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
        - description: entity type IDs; when provided this filter takes precedence over isLocation
          name: entityTypeIds
          in: query
          explode: true
          schema:
            type: array
            items:
              type: string
        - description: "field to order by; valid values: name, createdAt, updatedAt, assetId"
          name: orderBy
          in: query
          schema:
            type: string
        - description: "order direction; valid values: asc, desc. Defaults to desc for createdAt and updatedAt, asc otherwise"
          name: orderDirection
          in: query
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityListResult"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entitiesGetAll
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Create Entity
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.EntityCreate"
        description: Entity Data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entitiesCreate
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/entities/{id}:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Get Entity
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityGet
    put:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Update Entity
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.EntityUpdate"
        description: Entity Data
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityUpdate
    delete:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Delete Entity
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityDelete
    patch:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Patch Entity
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.EntityPatch"
        description: Entity Data
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityPatch
  /v1/entities/{id}/attachments:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities Attachments
      summary: Create Entity Attachment
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  description: File attachment
                  type: string
                  format: binary
                type:
                  description: Type of file
                  type: string
                primary:
                  description: Is this the primary attachment
                  type: boolean
                name:
                  description: name of the file including extension
                  type: string
              required:
                - file
                - name
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "422":
          description: Unprocessable Entity
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validate.ErrorResponse"
      operationId: entityAttachmentCreate
  /v1/entities/{id}/attachments/{attachment_id}:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities Attachments
      summary: Get Entity Attachment
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/TenantQuery"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
        - description: Attachment ID
          name: attachment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityAttachmentGet
    put:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities Attachments
      summary: Update Entity Attachment
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
        - description: Attachment ID
          name: attachment_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.ItemAttachmentUpdate"
        description: Attachment Update
        required: true
      responses:
        "200":
          description: OK
          content:
            "*/*":
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityAttachmentUpdate
    delete:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities Attachments
      summary: Delete Entity Attachment
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
        - description: Attachment ID
          name: attachment_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityAttachmentDelete
  /v1/entities/{id}/attachments/external:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      description: Links an entity to a document or URL in an external system without copying
      tags:
        - Entities Attachments
      summary: Create External Link Attachment
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/v1.externalAttachmentRequest"
        description: External document reference
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "400":
          description: Bad Request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/validate.ErrorResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityAttachmentExternalCreate
  /v1/entities/{id}/duplicate:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Duplicate Entity
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.DuplicateOptions"
        description: Duplicate Options
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityDuplicate
  /v1/entities/{id}/maintenance:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Item Maintenance
      summary: Get Maintenance Log
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Item ID
          name: id
          in: path
          required: true
          schema:
            type: string
        - x-enum-varnames:
            - MaintenanceFilterStatusScheduled
            - MaintenanceFilterStatusCompleted
            - MaintenanceFilterStatusBoth
          name: status
          in: query
          schema:
            type: string
            enum:
              - scheduled
              - completed
              - both
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/repo.MaintenanceEntryWithDetails"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: maintenanceLogGet
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Item Maintenance
      summary: Create Maintenance Entry
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Item ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.MaintenanceEntryCreate"
        description: Entry Data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.MaintenanceEntry"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: maintenanceEntryCreate
  /v1/entities/{id}/path:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Get the full path of an entity
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/repo.EntityPath"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityFullPath
  /v1/entities/export:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Export Entities
      responses:
        "200":
          description: CSV export
          content:
            text/csv:
              schema:
                type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entitiesExport
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - $ref: "#/components/parameters/TenantQuery"
  /v1/entities/fields:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Get All Custom Field Names
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: getAllCustomFieldNames
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/entities/fields/values:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Get All Custom Field Values
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Field name
          name: field
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: getAllCustomFieldValues
  /v1/entities/import:
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Import Entities
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                csv:
                  description: CSV file to upload
                  type: string
                  format: binary
              required:
                - csv
        required: true
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entitiesImport
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/entities/tree:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entities
      summary: Get Locations Tree
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: include items in response tree
          name: withItems
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/repo.TreeItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: locationTreeQuery
  /v1/entity-types:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entity Types
      summary: Get All Entity Types
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/repo.EntityTypeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityTypeGetAll
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entity Types
      summary: Create Entity Type
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.EntityTypeCreate"
        description: Entity Type Data
        required: true
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityTypeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityTypeCreate
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/entity-types/{id}:
    put:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entity Types
      summary: Update Entity Type
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity Type ID
          name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/repo.EntityTypeUpdate"
        description: Entity Type Data
        required: true
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.EntityTypeSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityTypeUpdate
    delete:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Entity Types
      summary: Delete Entity Type
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Entity Type ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: No Content
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: entityTypeDelete
  /v1/group/exports:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      description: Returns export job rows for the caller's group, newest first.
      tags:
        - Group
      summary: List Collection Exports
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/v1.Results-repo_ExportOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: exportsList
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
    post:
      security:
        - SessionCookie: []
        - ApiKey: []
      description: Creates a pending export row and enqueues the build job. Poll the listing endpoint or watch the WebSocket for completion.
      tags:
        - Group
      summary: Start a Collection Export
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.ExportOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: exportsCreate
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
  /v1/group/exports/{id}:
    get:
      security:
        - SessionCookie: []
        - ApiKey: []
      tags:
        - Group
      summary: Get an Export
      parameters:
        - $ref: "#/components/parameters/TenantHeader"
        - description: Export ID
          name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/repo.ExportOut"
        "401":
          $ref: "#/components/responses/Unauthorized"
      operationId: exportGet
    delete:
      security:
