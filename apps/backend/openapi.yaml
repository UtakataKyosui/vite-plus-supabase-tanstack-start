  parameters:
    TenantHeader:
      name: X-Tenant
      in: header
      required: false
      description: Collection (group) ID to operate on. Defaults to the user's default collection.
      schema:
        type: string
        format: uuid
    TenantQuery:
      name: tenant
      in: query
      required: false
      description: Fallback for X-Tenant when headers cannot be set (e.g. <img src>).
      schema:
        type: string
        format: uuid
  responses:
    Unauthorized:
      description: Missing, invalid or expired token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/validate.ErrorResponse"
    Forbidden:
      description: Authenticated but not allowed (role or collection ownership)
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/validate.ErrorResponse"
    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/validate.ErrorResponse"
