$schema: "https://moonrepo.dev/schemas/project.json"

language: "typescript"
layer: "library"
stack: "backend"

tasks:
  generate-schemas:
    command: "vp run generate:schemas"
    inputs:
      - "openapi.yaml"
      - "orval.config.ts"
    outputs:
      - "src/generated"

  check:
    command: "vp run check:all"
    inputs:
      - "openapi.yaml"
      - "orval.config.ts"
      - "src/**/*"
      - "package.json"
      - "tsconfig.json"
