name: Check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Detect relevant changes
        id: filter
        uses: dorny/paths-filter@v4.0.3
        with:
          filters: |
            code:
              - '**/*.{ts,tsx,js,jsx,mjs,cjs,mts,cts}'
              - '**/*.css'
              - '**/package.json'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - '**/tsconfig.json'
              - '**/biome.json'
              - '**/.fallowrc.json'
              - '**/moon.yml'
              - '.moon/**'
              - '.prototools'
              - '.github/workflows/check.yml'

      - name: Skip (no relevant changes)
        if: steps.filter.outputs.code != 'true'
        run: echo "No TypeScript or tooling changes detected; skipping checks."

      - uses: voidzero-dev/setup-vp@v1.22.0
        if: steps.filter.outputs.code == 'true'
        with:
          node-version: "26"
          cache: true

      - uses: moonrepo/setup-toolchain@v0.6.4
        if: steps.filter.outputs.code == 'true'
        with:
          auto-install: true

      - name: Install dependencies
        if: steps.filter.outputs.code == 'true'
        run: vp install

      - name: Restore Vite Task cache
        id: vite-task-cache
        if: steps.filter.outputs.code == 'true'
        uses: actions/cache/restore@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: vite-task-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vite-task-${{ runner.os }}-${{ runner.arch }}-

      - name: moon run :check (vp check + Biome + fallow)
        if: steps.filter.outputs.code == 'true'
        run: moon run :check

      - name: Save Vite Task cache
        if: steps.filter.outputs.code == 'true' && success()
        uses: actions/cache/save@v6.1.0
        with:
          path: node_modules/.vite/task-cache
          key: ${{ steps.vite-task-cache.outputs.cache-primary-key }}
